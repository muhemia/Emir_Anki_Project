# Platzhalter cards.example.com und Zertifikatpfade vor Aktivierung ersetzen.
# /srv/emir-cards/current enthält den gebauten Release inklusive dist/.
server {
    listen 80;
    listen [::]:80;
    server_name cards.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cards.example.com;
    ssl_certificate /etc/letsencrypt/live/cards.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cards.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/emir-cards/current/dist;
    index index.html;
    client_max_body_size 300m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # sql.js benötigt WebAssembly; Bilder werden auch als lokale Blob-URLs gezeigt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    # HTML, Service Worker und Manifest müssen neue Releases erkennen können.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
