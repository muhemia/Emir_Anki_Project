# HTTP-Bootstrap: ermöglicht die Ausstellung des ersten Zertifikats.
# Die App wird erst über die HTTPS-Konfiguration freigegeben.
server {
    listen 80;
    listen [::]:80;
    server_name cards.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Emir Cards: HTTPS-Einrichtung noch nicht abgeschlossen.\n";
    }
}
